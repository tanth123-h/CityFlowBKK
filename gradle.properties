# Project-wide Gradle settings.
#
# FIX: mergeDebugJavaResource VerifyException
# Root cause: JVM default locale (e.g., Thai/Buddhist calendar) causes Calendar.getInstance()
# to produce a year (e.g., 2567) outside the MS-DOS 1980-2107 range.
# Fix: Force en_US locale and UTC timezone.
#
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.timezone=UTC -Duser.language=en -Duser.country=US
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.daemon=false
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
